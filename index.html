<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Australian Tourism Visualisations</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: #004b8d;
      color: white;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 30px;
    }
    
    .vis {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      width: 1000px;
      max-width: 100%;
    }
    .vis h2 {
      text-align: center;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tourism in Australia (2019–2024)</h1>
  </header>

  <div class="container">
    <!-- Map Visualisation -->
    <div class="vis">
      <div id="map_vis"></div>
    </div>

    <!-- Line Chart Visualisation -->
    <div class="vis">
      <div id="line_vis"></div>
    </div>
  </div>

  <script>
    // Embed Map
    vegaEmbed('#map_vis', 'js/map.vg.json').then(function(result) {
      // You can access the Vega view instance as result.view
    }).catch(console.error);

    // Embed Line Chart
    vegaEmbed('#line_vis', 'js/domestic_spend_line.vg.json').then(function(result) {
      // You can access the Vega view instance as result.view
    }).catch(console.error);
  </script>
</body>
</html>
