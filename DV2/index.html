<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Australian Tourism Visualisations</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
    header { text-align: center; padding: 20px; background-color: #004b8d; color: white; }
    .container { display: flex; flex-direction: column; gap: 30px; padding: 30px; align-items: center; }
    .vis { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 100%; max-width: 1000px; }
    .charts-row { display: flex; gap: 20px; width: 100%; }
    .chart { flex: 1; min-width: 300px; height: 500px; }
  </style>
</head>
<body>
  <header>
    <h1>Tourism in Australia (2019–2024)</h1>
  </header>

  <div class="container">
    <!-- Top maps -->
    <div class="vis">
      <div id="domestic_map_vis" style="height: 500px;"></div>
    </div>

    <div class="vis">
      <div id="international_map_vis" style="height: 500px;"></div>
    </div>

    <!-- Line charts side by side -->
    <div class="charts-row">
      <div class="chart vis">
        <div id="domestic_spend_line_vis"></div>
      </div>
      <div class="chart vis">
        <div id="international_spend_line_vis"></div>
      </div>
    </div>
  </div>

  <script>
    // Embed the visualisations
    vegaEmbed('#domestic_map_vis', 'js/map.vg.json', { actions: false }).catch(console.error);
    vegaEmbed('#international_map_vis', 'js/international_visitor_map.vg.json', { actions: false }).catch(console.error);

    vegaEmbed('#domestic_spend_line_vis', 'js/domestic_spend_line.vg.json', { actions: false }).catch(console.error);
    vegaEmbed('#international_spend_line_vis', 'js/international_spend_line.vg.json', { actions: false }).catch(console.error);
  </script>
</body>
</html>
